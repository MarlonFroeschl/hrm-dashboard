name: CI Pipeline

# Läuft bei jedem Push und Pull Requests
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:  # Manually trigger

# Verhindert parallele Runs auf demselben Branch (z.B. schnelle aufeinanderfolgende Pushes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend: Linting + Type Check + Tests
  # ─────────────────────────────────────────────────────────────────────────────
  backend-quality:
    name: Backend – Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hrm_test
          POSTGRES_USER: hrm
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hrm:test_password@localhost:5432/hrm_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Tests (pytest)
        working-directory: backend
        run: pytest -v --cov=app --cov-report=xml --cov-report=term-missing
        continue-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend: Security Scan (pip-audit)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-security:
    name: Backend – Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: pip install -e "."

      - name: pip-audit (CVE-Scan)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit --format=json --output=pip-audit-report.json || true
          pip-audit
        continue-on-error: true

      - name: Secret scan (Backend)
        run: |
          FOUND=$(grep -rn \
            -e "password\s*=\s*['\"]" \
            -e "api_key\s*=\s*['\"]" \
            -e "secret\s*=\s*['\"]" \
            --include="*.py" \
            --exclude-dir=__pycache__ \
            --exclude-dir=.venv \
            backend/app/ 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "⚠️ Mögliche hardcoded Secrets:"
            echo "$FOUND"
            echo "::warning::Mögliche hardcoded Secrets im Python-Code gefunden"
          else
            echo "✅ Keine hardcoded Secrets gefunden"
          fi

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend: TypeScript + Lint + Tests
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-quality:
    name: Frontend – Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Tests (Vitest)
        working-directory: frontend
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend: Security Scan (npm audit)
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-security:
    name: Frontend – Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit (CVE-Scan)
        working-directory: frontend
        run: npm audit --audit-level=high --production
        continue-on-error: true

      - name: Secret scan (Frontend)
        run: |
          FOUND=$(grep -rn \
            -e "apiKey\s*=\s*['\"]" \
            -e "password\s*=\s*['\"]" \
            -e "AKIA[0-9A-Z]" \
            --include="*.ts" \
            --include="*.tsx" \
            frontend/src/ 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "⚠️ Mögliche hardcoded Secrets:"
            echo "$FOUND"
            echo "::warning::Mögliche hardcoded Secrets im Frontend-Code gefunden"
          else
            echo "✅ Keine hardcoded Secrets gefunden"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker: Build-Test (kein Push, nur prüfen ob Images bauen)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker – Build
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: hrm-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: hrm-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose config
        run: docker compose config --quiet
