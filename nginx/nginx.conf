# nginx.conf – Top-Level Reverse Proxy
#
# Aufgaben:
#   - HTTP (Port 80) → Redirect zu HTTPS
#   - HTTPS (Port 443) → SSL-Terminierung
#   - /api/* → Backend (FastAPI)
#   - /*     → Frontend (React SPA via nginx)
#   - Rate Limiting auf Auth-Endpoints
#   - Security Headers
#
# SSL-Zertifikate:
#   Pfad im Container: /etc/nginx/certs/
#   Pfad auf Host:     ./nginx/certs/
#
#   Self-signed (Entwicklung/Staging):
#     openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#       -keyout ./nginx/certs/server.key \
#       -out ./nginx/certs/server.crt \
#       -subj "/CN=localhost"
#
#   Let's Encrypt (Produktion):
#     certbot certonly --standalone -d yourdomain.com
#     Dann server.crt + server.key in ./nginx/certs/ symlinken

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ──────────────────────────────────────────────────────────────────────────
    # Logging – IP-Adressen loggen, keine sensiblen Header
    # ──────────────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ──────────────────────────────────────────────────────────────────────────
    # Performance
    # ──────────────────────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Nginx-Version in Response-Headern verbergen
    server_tokens off;

    # ──────────────────────────────────────────────────────────────────────────
    # Gzip
    # ──────────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ──────────────────────────────────────────────────────────────────────────
    # Rate Limiting – schützt Auth-Endpoints vor Brute-Force
    # Zone: 10 MB Shared Memory → ~160.000 unique IPs speicherbar
    # Limit: 5 Requests/Minute pro IP auf Auth-Endpoints
    # ──────────────────────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # ──────────────────────────────────────────────────────────────────────────
    # Upstreams
    # ──────────────────────────────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
        keepalive 16;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # HTTP → HTTPS Redirect
    # Ausnahme: /nginx-health für Docker HEALTHCHECK (kein TLS nötig)
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ──────────────────────────────────────────────────────────────────────────
    # HTTPS Server
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # ──────────────────────────────────────────────────────────────────────
        # SSL-Konfiguration
        # Zertifikate: ./nginx/certs/server.crt + ./nginx/certs/server.key
        # ──────────────────────────────────────────────────────────────────────
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Nur moderne TLS-Versionen erlauben (TLS 1.0 + 1.1 deaktiviert)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        # Session-Cache für Performance (weniger TLS-Handshakes)
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ──────────────────────────────────────────────────────────────────────
        # Security Headers
        # HSTS: Browser merkt sich HTTPS-Only für 1 Jahr
        # CSP: verhindert XSS durch inline-Scripts (ggf. anpassen für App-Anforderungen)
        # ──────────────────────────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ──────────────────────────────────────────────────────────────────────
        # Auth-Endpoints: Rate Limiting (5 req/min pro IP, burst 3)
        # ──────────────────────────────────────────────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ──────────────────────────────────────────────────────────────────────
        # API-Endpoints: /api/* → Backend
        # Höhere Timeouts für KI-Requests (Claude API)
        # ──────────────────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            # Lange Timeouts für KI-Requests (Claude API kann >60s dauern)
            proxy_connect_timeout 10s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # ──────────────────────────────────────────────────────────────────────
        # Health Check für Monitoring (kein Rate Limit)
        # ──────────────────────────────────────────────────────────────────────
        location /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # ──────────────────────────────────────────────────────────────────────
        # Nginx interner Health-Check (Docker HEALTHCHECK nutzt HTTP auf Port 80)
        # ──────────────────────────────────────────────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ──────────────────────────────────────────────────────────────────────
        # Frontend: alle anderen Requests → React SPA
        # ──────────────────────────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
