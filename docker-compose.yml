# HRM Dashboard – Docker Compose
# Zielumgebung: Dedicated Server / VPS (8+ GB RAM, 4+ CPUs)
# Externe Services: n8n läuft NICHT hier – nur ausgehende Webhooks vom Backend
#
# Netzwerk-Übersicht:
#   postgres  → Port 5432 (nur intern)
#   redis     → Port 6379 (nur intern)
#   qdrant    → Port 6333/6334 (nur intern)
#   backend   → Port 8000 (intern + extern für direkten Zugriff)
#   frontend  → Port 80 intern (über nginx erreichbar)
#   nginx     → Port 80 + 443 (einziger öffentlicher Eintrittspunkt)
#
# Startup-Reihenfolge: postgres → redis → qdrant → backend → frontend → nginx

services:

  # ──────────────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 – Primäre Datenbank
  # ──────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hrm-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrm}
      POSTGRES_USER: ${POSTGRES_USER:-hrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Verhindert Daten-Korruption bei unerwartetem Container-Stop
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port nur intern – kein direkter Zugriff von außen
    # Für Admin-Zugriff: docker exec -it hrm-postgres psql -U hrm -d hrm
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrm} -d ${POSTGRES_DB:-hrm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hrm-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

  # ──────────────────────────────────────────────────────────────────────────────
  # Redis 7 Alpine – Caching + Queue
  # ──────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hrm-redis
    restart: unless-stopped
    # appendonly aktiviert AOF-Persistenz – Daten überleben Container-Neustart
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - hrm-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M

  # ──────────────────────────────────────────────────────────────────────────────
  # Qdrant – Vektor-Datenbank für KI-Features
  # Port 6333: HTTP REST API
  # Port 6334: gRPC API
  # ──────────────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hrm-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    networks:
      - hrm-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

  # ──────────────────────────────────────────────────────────────────────────────
  # Backend – FastAPI + Uvicorn
  # Alembic-Migrationen laufen als separater Schritt (nicht beim Start)
  # Befehl für Migrationen: docker compose exec backend alembic upgrade head
  # ──────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrm-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Überschreibt .env DATABASE_URL mit intern aufgelöstem Hostnamen
      DATABASE_URL: postgresql://${POSTGRES_USER:-hrm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hrm}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    volumes:
      - uploads_data:/app/uploads
    # Port 8000 auch direkt erreichbar für Debugging / API-Clients
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hrm-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M

  # ──────────────────────────────────────────────────────────────────────────────
  # Frontend – React/Vite Build → Nginx
  # Statische Assets werden von Nginx ausgeliefert (kein Node.js im Runtime-Image)
  # ──────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrm-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - hrm-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  # ──────────────────────────────────────────────────────────────────────────────
  # NGINX – Reverse Proxy (einziger öffentlicher Eintrittspunkt)
  # Port 80:  HTTP → Redirect zu HTTPS
  # Port 443: HTTPS mit SSL-Terminierung
  # SSL-Zertifikate: ./nginx/certs/ (Let's Encrypt oder self-signed)
  # ──────────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: hrm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hrm-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 32M

  # ──────────────────────────────────────────────────────────────────────────────
  # Mailhog – E-Mail-Testing (nur im dev-Profil aktiv)
  # Starten mit: docker compose --profile dev up
  # Web-UI: http://localhost:8025
  # SMTP: localhost:1025
  # ──────────────────────────────────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: hrm-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - hrm-network
    profiles:
      - dev
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

# ──────────────────────────────────────────────────────────────────────────────
# Benannte Volumes – alle mit lokalem Driver (portabel auf jeden Linux-Server)
# Backup-Pfade auf Host:
#   /var/lib/docker/volumes/hrm-dashboard_postgres_data/_data
#   /var/lib/docker/volumes/hrm-dashboard_redis_data/_data
#   /var/lib/docker/volumes/hrm-dashboard_qdrant_data/_data
#   /var/lib/docker/volumes/hrm-dashboard_uploads_data/_data
# ──────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  uploads_data:
    driver: local

# ──────────────────────────────────────────────────────────────────────────────
# Netzwerk – isoliertes Bridge-Netzwerk
# Alle Services kommunizieren über Container-Namen als Hostnamen
# ──────────────────────────────────────────────────────────────────────────────
networks:
  hrm-network:
    driver: bridge
    name: hrm-network
