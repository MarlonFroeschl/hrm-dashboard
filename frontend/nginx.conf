# nginx.conf – Frontend-Container (SPA + API-Proxy)
# Dieser Container serviert die statische React-App und leitet /api/* an das Backend weiter.
# Läuft hinter dem Top-Level nginx Reverse Proxy (./nginx/nginx.conf).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ──────────────────────────────────────────────────────────────────────────
    # Gzip-Komprimierung für statische Assets
    # ──────────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ──────────────────────────────────────────────────────────────────────────
    # Security Headers
    # X-Frame-Options: verhindert Clickjacking
    # X-Content-Type-Options: verhindert MIME-Sniffing
    # X-XSS-Protection: Legacy-Browser XSS-Filter
    # Referrer-Policy: kein Referrer bei externen Requests
    # ──────────────────────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ──────────────────────────────────────────────────────────────────────────
    # Statische Assets – aggressives Caching für versionierte Dateien
    # Vite erzeugt Hashes im Dateinamen (main.a1b2c3.js) → sicher zu cachen
    # ──────────────────────────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # API-Proxy: /api/* → Backend (FastAPI auf Port 8000)
    # trailing slash fehlt absichtlich – /api wird korrekt weitergeleitet
    # ──────────────────────────────────────────────────────────────────────────
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts für langlaufende KI-Requests (Claude API kann >10s dauern)
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # Health-Check Endpoint für Docker HEALTHCHECK
    # ──────────────────────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # React SPA: alle anderen Routen → index.html
    # try_files: erst echte Datei suchen, sonst index.html (Client-Side Routing)
    # ──────────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
